name: gravador_app
description: "App de gravação de conversas com resumo por IA (protótipo v1)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  record: ^5.1.2          # gravação de áudio (Android e iOS)
  path_provider: ^2.1.3   # encontrar a pasta onde salvar os arquivos de áudio
  permission_handler: ^11.3.1  # pedir permissão de microfone ao usuário
  intl: ^0.19.0            # formatar datas/horas na lista de gravações

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
